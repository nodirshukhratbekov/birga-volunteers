<meta name="description" content="Birga connects Tashkent volunteers with projects and events. Earn stitches, collect certificates, climb the board.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8EFE0; --paper-2:#F1E4CF; --card:#FCF6EC;
    --ink:#2C1A2E; --ink-soft:#6b5a6c; --ink-faint:#9b8b9c;
    --pom:#C42E5A; --pom-d:#9e2347;
    --saf:#E8951F; --teal:#1C9486;
    --line:rgba(44,26,46,.16); --line-strong:rgba(44,26,46,.28);
    --bronze:#B0763C; --silver:#8b8f99; --gold:#E8951F; --plat:#1C9486; --diamond:#C42E5A;
    --r:14px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:16px}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:0}
  :focus-visible{outline:3px solid var(--saf);outline-offset:2px;border-radius:6px}
  .hidden{display:none !important}

  .eyebrow{font-family:var(--display);font-weight:600;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--pom);display:inline-flex;align-items:center;gap:.6em}
  .eyebrow::before{content:"";width:24px;border-top:2px dashed var(--pom)}

  .btn{font-family:var(--display);font-weight:700;font-size:.98rem;border:none;cursor:pointer;padding:.78em 1.4em;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:.5em;transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .2s}
  .btn-primary{background:var(--pom);color:var(--paper);box-shadow:0 5px 0 var(--pom-d)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--pom-d),0 12px 22px rgba(196,46,90,.3)}
  .btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pom-d)}
  .is-busy{position:relative;pointer-events:none;color:transparent !important}
  .is-busy *{visibility:hidden}
  .is-busy::after{content:"";position:absolute;left:50%;top:50%;width:1.05em;height:1.05em;margin:-.525em 0 0 -.525em;border:2.5px solid var(--spin,currentColor);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;visibility:visible}
  @media(prefers-reduced-motion:reduce){.is-busy::after{animation-duration:2s}}
  .btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
  .btn-ghost:hover{background:var(--ink);color:var(--paper);transform:translateY(-2px)}
  .btn-sm{padding:.55em .95em;font-size:.86rem;border-radius:8px;box-shadow:0 4px 0 var(--pom-d)}
  .btn-sm:hover{box-shadow:0 5px 0 var(--pom-d),0 8px 14px rgba(196,46,90,.28)}

  .brand{display:flex;align-items:center;gap:.55em;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
  .knot{width:30px;height:30px;flex:0 0 auto}

  .pill{display:inline-flex;align-items:center;gap:.4em;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.04em;padding:.3em .7em;border-radius:999px;text-transform:uppercase}

  /* LANDING */
  .lnav{position:sticky;top:0;z-index:40;background:rgba(248,239,224,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .lnav-in{max-width:1180px;margin:0 auto;padding:0 24px;height:70px;display:flex;align-items:center;justify-content:space-between}
  .lnav-links{display:flex;gap:28px}
  .lnav-links a{font-weight:600;color:var(--ink-soft);font-size:.96rem}
  .lnav-links a:hover{color:var(--ink)}
  .lnav-cta{display:flex;gap:12px;align-items:center}
  .ln-login{font-family:var(--display);font-weight:700;cursor:pointer;background:none;border:none;font-size:.96rem}

  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  .hero{padding:64px 0 76px}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
  .hero h1{font-size:clamp(2.7rem,6vw,5rem);margin:.3em 0}
  .hero h1 .hl{color:var(--pom);position:relative;white-space:nowrap}
  .hero h1 .hl::after{content:"";position:absolute;left:0;right:0;bottom:.07em;height:.16em;background:var(--saf);opacity:.5;border-radius:3px;z-index:-1}
  .lead{font-size:clamp(1.05rem,1.4vw,1.22rem);color:var(--ink-soft);max-width:38ch;margin:0 0 26px}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap}
  .tiny{font-size:.9rem;color:var(--ink-soft);margin-top:16px}
  .tiny b{color:var(--ink)}
  .medallion-stage{display:flex;justify-content:center;align-items:center;position:relative}
  .medallion-stage svg{width:min(420px,84vw);height:auto;overflow:visible}

  .lstats{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:34px 0}
  .lstats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .lpatch{text-align:center;position:relative}
  .lpatch:not(:last-child)::after{content:"";position:absolute;right:-9px;top:12%;bottom:12%;width:1px;background:var(--line)}
  .lpatch .n{font-family:var(--display);font-weight:800;font-size:clamp(2rem,3.4vw,2.8rem);line-height:1}
  .lpatch:nth-child(1) .n{color:var(--pom)} .lpatch:nth-child(2) .n{color:var(--teal)} .lpatch:nth-child(3) .n{color:var(--saf)} .lpatch:nth-child(4) .n{color:var(--ink)}
  .lpatch .l{font-size:.84rem;color:var(--ink-soft);margin-top:6px}

  .lsec{padding:88px 0}
  .lsec-head{max-width:60ch;margin-bottom:42px}
  .lsec-head h2{font-size:clamp(1.9rem,3.4vw,2.9rem);margin:.35em 0}
  .lsec-head p{color:var(--ink-soft);font-size:1.08rem;margin:0}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);border:1px dashed var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--card)}
  .step{padding:30px 24px;border-right:1px dashed var(--line-strong)}
  .step:last-child{border-right:none}
  .step .ico{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;color:var(--paper);margin-bottom:16px}
  .step:nth-child(1) .ico{background:var(--pom)} .step:nth-child(2) .ico{background:var(--teal)} .step:nth-child(3) .ico{background:var(--saf)} .step:nth-child(4) .ico{background:var(--ink)}
  .step .no{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.1em;color:var(--ink-faint)}
  .step h3{font-size:1.22rem;margin:6px 0 8px}
  .step p{margin:0;color:var(--ink-soft);font-size:.95rem}

  .lcta{background:var(--ink);color:var(--paper);border-radius:20px;padding:56px;text-align:center;margin-bottom:88px}
  .lcta h2{font-size:clamp(2rem,3.6vw,3rem);color:var(--paper);max-width:18ch;margin:0 auto .2em}
  .lcta p{color:rgba(248,239,224,.72);font-size:1.1rem;max-width:46ch;margin:0 auto 28px}
  .lfoot{border-top:1px dashed var(--line);padding:34px 0;color:var(--ink-soft);font-size:.9rem;text-align:center}

  /* AUTH */
  .auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
  .auth-art{background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:space-between;padding:48px}
  .auth-art .medallion-stage svg{width:min(360px,70%)}
  .auth-art-mid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
  .auth-art h2{color:var(--paper);font-size:1.9rem;max-width:16ch}
  .auth-art p{color:rgba(248,239,224,.7);max-width:34ch;margin:0}
  .auth-main{display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .auth-card{width:100%;max-width:400px}
  .auth-card>.brand{justify-content:center;margin-bottom:22px}
  .auth-card h1{font-size:1.9rem;text-align:center}
  .auth-sub{text-align:center;color:var(--ink-soft);margin:6px 0 22px}
  .seg{display:flex;background:var(--paper-2);border-radius:11px;padding:5px;margin-bottom:22px}
  .seg button{flex:1;border:none;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:.94rem;padding:.6em;border-radius:8px;color:var(--ink-soft);transition:all .2s}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(44,26,46,.12)}
  .field{margin-bottom:15px}
  .field label{display:block;font-family:var(--display);font-weight:600;font-size:.86rem;margin-bottom:6px}
  .field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-family:var(--body);font-size:.98rem;color:var(--ink);transition:border .2s,box-shadow .2s}
  .field input:focus{outline:none;border-color:var(--pom);box-shadow:0 0 0 3px rgba(196,46,90,.16)}
  .field input.err{border-color:var(--pom);background:#fbe7ec}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .auth-card .btn-primary{width:100%;margin-top:6px}
  .auth-err{display:none;background:#fbe7ec;color:var(--pom-d);border:1px solid var(--pom);border-radius:9px;padding:9px 12px;font-size:.85rem;font-weight:600;margin-bottom:14px}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--ink-faint);font-size:.74rem;letter-spacing:.12em;font-family:var(--display);font-weight:600}
  .divider::before,.divider::after{content:"";flex:1;border-top:1px dashed var(--line)}
  .social{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .social button{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-family:var(--display);font-weight:700;font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
  .social button:hover{background:var(--paper-2)}
  .dbnote{text-align:center;font-size:.78rem;margin-top:16px;font-weight:600}
  .dbnote .on{color:var(--teal)} .dbnote .off{color:var(--ink-faint)}
  .legal{text-align:center;font-size:.8rem;color:var(--ink-faint);margin-top:14px}

  /* APP SHELL */
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .side{background:var(--card);border-right:1px dashed var(--line-strong);padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side .brand{padding:0 8px 22px}
  .side-nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .side-nav button{display:flex;align-items:center;gap:12px;border:none;background:none;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.98rem;color:var(--ink-soft);padding:11px 12px;border-radius:11px;text-align:left;transition:background .18s,color .18s}
  .side-nav button:hover{background:var(--paper-2);color:var(--ink)}
  .side-nav button.on{background:var(--pom);color:var(--paper)}
  .side-nav button.on svg{stroke:var(--paper)}
  .side-foot{border-top:1px dashed var(--line);padding-top:14px}
  .side-foot button{display:flex;align-items:center;gap:10px;border:none;background:none;cursor:pointer;font-weight:600;color:var(--ink-soft);font-size:.94rem;padding:8px 12px;border-radius:10px;width:100%}
  .side-foot button:hover{color:var(--pom)}

  .main{padding:36px 40px 60px;max-width:1080px;min-width:0}
  .page-head{margin-bottom:26px}
  .page-head h1{font-size:clamp(1.7rem,3vw,2.3rem)}
  .page-head p{color:var(--ink-soft);margin:6px 0 0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}

  .profile{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .ava{flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--paper)}
  .ava-lg{width:62px;height:62px;font-size:1.5rem}
  .profile-info{flex:1;min-width:200px}
  .profile-info .nm{font-family:var(--display);font-weight:800;font-size:1.4rem;display:flex;align-items:center;gap:10px}
  .profile-info .un{color:var(--ink-soft);font-size:.92rem}
  .xpbar-wrap{margin-top:12px}
  .xpbar-top{display:flex;justify-content:space-between;font-size:.84rem;color:var(--ink-soft);margin-bottom:5px}
  .xpbar{height:12px;background:var(--paper-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--pom),var(--saf));border-radius:999px;transition:width 1s var(--ease)}

  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;position:relative}
  .stat::before{content:"";position:absolute;left:16px;right:16px;top:0;border-top:3px dashed var(--c,var(--pom))}
  .stat .v{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1;margin:8px 0 4px}
  .stat .k{font-size:.78rem;color:var(--ink-soft)}
  .stat svg{color:var(--c,var(--pom))}

  .checkin{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:24px;margin-top:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .checkin .qr{width:52px;height:52px;border-radius:12px;background:rgba(248,239,224,.12);display:grid;place-items:center;flex:0 0 auto}
  .checkin .ci-txt{flex:1;min-width:180px}
  .checkin h3{color:var(--paper);font-size:1.2rem}
  .checkin p{margin:4px 0 0;color:rgba(248,239,224,.7);font-size:.92rem}
  .checkin .btn{background:var(--saf);color:var(--ink);box-shadow:0 4px 0 #b9740f}
  .checkin .btn:hover{box-shadow:0 6px 0 #b9740f,0 10px 18px rgba(232,149,31,.3)}

  .dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
  .blk-title{font-family:var(--display);font-weight:800;font-size:1.15rem;margin-bottom:14px}
  .unlock{padding:14px 0;border-bottom:1px dashed var(--line)}
  .unlock:last-child{border-bottom:none}
  .unlock .ut{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .unlock .un-name{font-family:var(--display);font-weight:700;font-size:.98rem}
  .unlock .un-next{font-size:.8rem;color:var(--ink-soft)}
  .bar{height:8px;background:var(--paper-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;background:var(--pom);border-radius:999px;transition:width .9s var(--ease)}
  .bar.teal > i{background:var(--teal)} .bar.saf > i{background:var(--saf)}
  .act{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .act:last-child{border-bottom:none}
  .act .an{font-weight:600;font-size:.94rem}
  .act .ad{font-size:.8rem;color:var(--ink-faint)}

  function flush(keepalive){

      .then(function(r){return r.json();})

  function loadImage(file){
    return new Promise(function(resolve){
      if(!file||!/^image\//.test(file.type))return resolve(null);
      var reader=new FileReader();
      reader.onload=function(e){ var img=new Image(); img.onload=function(){resolve(img);}; img.onerror=function(){resolve(null);}; img.src=e.target.result; };
      reader.onerror=function(){resolve(null);};
      reader.readAsDataURL(file);
    });
  }
  // fit = 'cover' (crop to fill) or 'contain' (logos); result always fits in one Sheets cell
  function resizeImage(file,w,hh,fit){
    return loadImage(file).then(function(img){
      if(!img)return '';
      var c=document.createElement('canvas'); c.width=w; c.height=hh;
      var ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,hh);
      var sw=img.width, sh=img.height, r;
      if(fit==='contain'){ r=Math.min(w/sw,hh/sh); var dw=sw*r, dh=sh*r; ctx.drawImage(img,(w-dw)/2,(hh-dh)/2,dw,dh); }
      else { r=Math.max(w/sw,hh/sh); var cw=w/r, ch=hh/r; ctx.drawImage(img,(sw-cw)/2,(sh-ch)/2,cw,ch,0,0,w,hh); }
      var q=0.8, data=c.toDataURL('image/jpeg',q);
      while(data.length>44000&&q>0.3){ q-=0.1; data=c.toDataURL('image/jpeg',q); }
      return data.length>44000?'':data;
    });
  }

  function buildMedallion(svg){
    var NS='http://www.w3.org/2000/svg';
    var POM='#C42E5A',SAF='#E8951F',TEAL='#1C9486',INK='#2C1A2E';
    function el(t,a){var n=document.createElementNS(NS,t);for(var k in a)n.setAttribute(k,a[k]);return n;}
    function petal(a,len,w,fill,op){return el('path',{d:'M0,0 C '+w+','+(-len*.35)+' '+w+','+(-len*.75)+' 0,'+(-len)+' C '+(-w)+','+(-len*.75)+' '+(-w)+','+(-len*.35)+' 0,0 Z',fill:fill,opacity:op||1,transform:'rotate('+a+')'});}
    var nodes=[];
    nodes.push(el('circle',{cx:0,cy:0,r:200,fill:'none',stroke:INK,'stroke-width':2,'stroke-dasharray':'2 12','stroke-linecap':'round',opacity:.5}));
    nodes.push(el('circle',{cx:0,cy:0,r:188,fill:'none',stroke:POM,'stroke-width':3,'stroke-dasharray':'10 10'}));
    for(var i=0;i<12;i++)nodes.push(petal(i*30,150,46,(i%2?SAF:POM),.9));
    for(var j=0;j<12;j++)nodes.push(petal(j*30+15,96,22,TEAL,.85));
    nodes.push(el('circle',{cx:0,cy:0,r:64,fill:'none',stroke:INK,'stroke-width':2.5,'stroke-dasharray':'6 8'}));
    var star='';for(var s=0;s<16;s++){var ang=Math.PI/8*s,rad=s%2===0?56:24;star+=(s===0?'M':'L')+(Math.cos(ang)*rad).toFixed(1)+','+(Math.sin(ang)*rad).toFixed(1)+' ';}
    nodes.push(el('path',{d:star+'Z',fill:POM}));
    nodes.push(el('circle',{cx:0,cy:0,r:16,fill:SAF}));
    nodes.push(el('circle',{cx:0,cy:0,r:6,fill:INK}));
    nodes.forEach(function(n){svg.appendChild(n);});
    if(!reduce){
      nodes.forEach(function(n,idx){var o=n.getAttribute('opacity')||'1';n.style.opacity='0';n.style.transition='opacity .5s ease';setTimeout(function(){n.style.opacity=o;},120+idx*45);});
      var t=0;(function spin(){t+=.04;svg.style.transform='rotate('+t+'deg)';requestAnimationFrame(spin);})();
    }
  }

  /* ---------- EVENTS ---------- */
  function myReg(eid){ return mine.registrations.filter(function(r){return r.eventId===eid&&r.status!=='cancelled'&&r.status!=='rejected';})[0]; }
  /* documents some events require (IELTS, SAT, passport) */
  var DOC_TYPES=['ielts','sat','passport'];
  var SEAT_STATUSES=['registered','paid']; // only confirmed places take a seat
  function evDocs(e){
    var d=e&&e.docs; if(typeof d==='string')d=d.split(/[\s,;]+/);
    return Array.isArray(d)?DOC_TYPES.filter(function(x){return d.map(function(y){return String(y).toLowerCase();}).indexOf(x)>=0;}):[];
  }
  function myDoc(type){ return (mine.documents||[]).filter(function(d){return d.type===type;})[0]; }

  function docName(d){ return t('doc_'+d); }
  // admins see the exact count from the registrations list (updates the moment a payment is marked)
  function evTaken(e){
    if(Array.isArray(state.adminRegs)&&hasPerm('events')&&String(e.id).indexOf('new-')!==0)
      return state.adminRegs.filter(function(r){return r.eventId===e.id&&SEAT_STATUSES.indexOf(r.status)>=0;}).length;
    return Number(e.taken)||0;
  }
  function evSeatsText(e){ return e.seats?t('ev_seats',{n:Math.max(0,e.seats-evTaken(e)),total:e.seats}):t('ev_unlimited'); }
  function evDocsLine(e,logged){
    var d=evDocs(e); if(!d.length)return '';
    return '<div class="docs-req">'+ic('doc',14)+' '+t('ev_docs')+' '+d.map(function(x){
      var st=logged?myDoc(x):null, cls=logged?(st&&st.status!=='rejected'?' ok':' no'):'';

  function evAction(e){

    var reqs=evReqs(e), locked=reqs.some(function(r){return !r.ok;});

    if(reg){
      var badge;

  function shareUrl(kind,id){ return location.href.split('#')[0]+'#'+kind+'='+encodeURIComponent(rawText(id)); }
  function copyText(text){
    var fallback=function(){
      var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); var ok=false; try{ok=document.execCommand('copy');}catch(e){} ta.remove(); return ok;
    };
    if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text).then(function(){return true;},function(){return fallback();});
    return Promise.resolve(fallback());
  }
  function shareItem(kind,id){
    var url=shareUrl(kind,id);
    copyText(url).then(function(ok){ toast(ok?ic('ok',14)+' '+t('t_link_copied'):h(url)); });

  function tryDeepLink(){

  /* ---------- PROGRESS (achievement monitoring) ---------- */
  function vProgress(){
    var L=mine.ledger, m=state.progMetric, monthStart=new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
    var sum=function(metric,since){ return L.filter(function(r){return r.metric===metric&&(!since||new Date(String(r.at))>=since);}).reduce(function(s,r){return s+r.amount;},0); };
    var cards='<div class="statgrid">'+METRICS.map(function(x){
      var mo=sum(x[0],monthStart);
      return '<button class="stat stat-btn'+(m===x[0]?' on':'')+'" data-action="progmetric" data-m="'+x[0]+'" style="--c:'+x[2]+'">'+ic(x[1],20)+
        '<div class="v">'+fmt(state.user[x[0]])+'</div><div class="k">'+metricName(x[0])+'</div>'+
        '<div class="month'+(mo<0?' neg':'')+'">'+(mo>0?'+':'')+fmt(mo)+' '+t('this_month')+'</div></button>';
    }).join('')+'</div>';
    var rows=L.filter(function(r){return m==='all'||r.metric===m;});
    // by project / event
    var by={};
    rows.forEach(function(r){ var k=r.sourceType+'|'+r.sourceId; if(!by[k])by[k]={name:r.source,type:r.sourceType,last:r.at,v:{}}; by[k].v[r.metric]=(by[k].v[r.metric]||0)+r.amount; });

  /* ---------- CERTIFICATE → PDF (drawn on a canvas, saved as a real PDF file, no libraries) ---------- */
  function rawText(v){ return String(v==null?'':v).replace(/&#(\d+);/g,function(m,n){return String.fromCharCode(n);}); }
  function fitFont(ctx,text,weight,size,maxW,family){
    do{ ctx.font=weight+' '+size+'px '+family; size-=4; }while(ctx.measureText(text).width>maxW&&size>20);
  }
  function wrapLines(ctx,text,maxW){
    var words=text.split(/ +/), lines=[], line=''; // non-breaking spaces keep a date together
    words.forEach(function(w){ var test=line?line+' '+w:w; if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;} else line=test; });
    if(line)lines.push(line); return lines;
  }
  function knotImage(){
    return new Promise(function(res){
      var img=new Image(); img.onload=function(){res(img);}; img.onerror=function(){res(null);};
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(I.knot.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" '));
    });
  }
  function drawCertificate(c){
    var W=2339, H=1654; // A4 landscape at 200 dpi
    var DISP='"Bricolage Grotesque", system-ui, sans-serif', BODY='"Hanken Grotesk", system-ui, sans-serif';
    var fontsReady=(document.fonts&&document.fonts.load)?Promise.all([
      document.fonts.load('800 100px "Bricolage Grotesque"'),document.fonts.load('600 40px "Bricolage Grotesque"'),document.fonts.load('400 40px "Hanken Grotesk"')
    ]).catch(function(){}):Promise.resolve();
    var timeout=new Promise(function(r){setTimeout(r,2500);});
    return Promise.race([fontsReady,timeout]).then(knotImage).then(function(knot){
      var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      var x=cv.getContext('2d'), cx=W/2;
      var INK='#2C1A2E', POM='#C42E5A', SAF='#E8951F', SOFT='#6b5a6c';
      x.fillStyle='#FCF6EC'; x.fillRect(0,0,W,H);
      x.strokeStyle='rgba(44,26,46,.28)'; x.lineWidth=3; x.strokeRect(48,48,W-96,H-96);
      x.strokeStyle=POM; x.lineWidth=8; x.setLineDash([30,18]); x.strokeRect(80,80,W-160,H-160); x.setLineDash([]);
      x.textBaseline='alphabetic';
      // header: logo + brand, certificate number
      if(knot)x.drawImage(knot,190,165,96,96);
      x.fillStyle=INK; x.textAlign='left'; x.font='800 66px '+DISP; x.fillText('Birga',305,236);
      x.fillStyle=SOFT; x.textAlign='right'; x.font='500 36px ui-monospace, Menlo, monospace'; x.fillText('№ '+rawText(c.id),W-190,230);
      x.textAlign='center';
      // kicker
      x.fillStyle=POM; x.font='600 40px '+DISP; if('letterSpacing' in x)x.letterSpacing='10px';
      x.fillText(rawText(t('cert_kicker')).toUpperCase(),cx,420); if('letterSpacing' in x)x.letterSpacing='0px';
      // title
      x.fillStyle=INK; fitFont(x,rawText(t('cert_title')),'800',150,W-520,DISP); x.fillText(rawText(t('cert_title')),cx,590);
      // awarded to
      x.fillStyle=SOFT; x.font='400 50px '+BODY; x.fillText(rawText(t('cert_given')),cx,705);
      // name + underline
      var name=rawText(c.fullName);
      x.fillStyle=POM; fitFont(x,name,'800',124,W-700,DISP); x.fillText(name,cx,865);
      var nw=Math.min(x.measureText(name).width+90,W-600);
      x.strokeStyle=SAF; x.lineWidth=6; x.beginPath(); x.moveTo(cx-nw/2,905); x.lineTo(cx+nw/2,905); x.stroke();
      // body text (wrapped)
      var q=lang==='en'?['\u201C','\u201D']:['\u00AB','\u00BB'], nb=function(v){return String(v).replace(/ /g,'\u00A0');};
      var body=rawText(t('cert_text',{project:q[0]+rawText(c.projectTitle)+q[1],hours:nb(fmt(c.hours)),date:nb(rawText(fmtDate(c.projectDate)))}));
      x.fillStyle=INK; x.font='400 50px '+BODY;
      wrapLines(x,body,1500).slice(0,4).forEach(function(l,i){ x.fillText(l,cx,1030+i*78); });
      // footer: signature line, seal, date line
      x.strokeStyle=INK; x.lineWidth=3;
      x.beginPath(); x.moveTo(300,1400); x.lineTo(900,1400); x.moveTo(W-900,1400); x.lineTo(W-300,1400); x.stroke();
      x.fillStyle=SOFT; x.font='400 38px '+BODY;
      x.fillText(rawText(t('cert_sign')),600,1458); x.fillText(rawText(fmtDate(c.issuedAt)),W-600,1458);
      x.font='400 30px '+BODY; x.fillStyle='#9b8b9c'; x.fillText(rawText(t('cert_verify_hint')),cx,H-118);
      if(knot)x.drawImage(knot,cx-95,1290,190,190);
      return cv;
    });
  }
  // minimal PDF: one A4-landscape page with the certificate as a JPEG image
  function canvasToPdf(cv){
    var b64=cv.toDataURL('image/jpeg',0.92).split(',')[1], bin=atob(b64), img=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
    var enc=new TextEncoder(), parts=[], offsets=[], len=0;
    function add(x){ var u=typeof x==='string'?enc.encode(x):x; parts.push(u); len+=u.length; }
    function obj(n,body){ offsets[n]=len; add(n+' 0 obj\n'); add(body); add('\nendobj\n'); }
    var pw=841.89, ph=595.28, content='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    add('%PDF-1.4\n%âãÏÓ\n');
    obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
    obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
    offsets[4]=len; add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n');
    add(img); add('\nendstream\nendobj\n');
    obj(5,'<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
    var xref=len, pad=function(n){return ('0000000000'+n).slice(-10);};
    add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(function(n){return pad(offsets[n])+' 00000 n \n';}).join(''));
    add('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
    return new Blob(parts,{type:'application/pdf'});
  }

  function userMatches(u,q){
    var words=String(q||'').toLowerCase().trim().split(/\s+/).filter(Boolean); if(!words.length)return true;
    var txt=[rawText(u.username),rawText(u.first),rawText(u.last),rawText(u.telegram)].join(' ').toLowerCase();
    var phone=rawText(u.phone).replace(/\D/g,'');
    return words.every(function(w){

  function doAuth(){
    var f=document.getElementById('authForm'); if(!f)return;
    var email=f.querySelector('[name=email]'), pw=f.querySelector('[name=pw]');
    var errBox=document.getElementById('authErr');
    function fail(msg){ if(errBox){errBox.textContent=msg;errBox.style.display='block';} }
    if(errBox)errBox.style.display='none';
    f.querySelectorAll('input').forEach(function(i){i.classList.remove('err');});
    var isSignup=state.authMode==='signup';
    var val=function(n){var e=f.querySelector('[name='+n+']');return e?e.value.trim():'';};
    var mark=function(n){var e=f.querySelector('[name='+n+']');if(e)e.classList.add('err');};

    if(!CONFIG.API_URL){ // demo mode
      if(isSignup){ if(val('first'))state.user.first=h(val('first')); if(val('last'))state.user.last=h(val('last')); if(val('un'))state.user.un=h(val('un'));
        state.user.stitches=0;state.user.hours=0;state.user.projects=0;state.user.loyalty=0; }
      state.screen='app';state.tab='dashboard';state.sideOpen=false;persistSession();render();
      toast(t('t_welcome',{name:state.user.first})+' (demo)');
      return;
    }
    if(isSignup){
      if(!val('first')||val('first').length>40){mark('first');return fail(t('e_name'));}
      if(!val('last')||val('last').length>40){mark('last');return fail(t('e_name'));}
      if(!/^[A-Za-z0-9_.]{3,20}$/.test(val('un'))){mark('un');return fail(t('e_username'));}
      if(!/^\+?[0-9\s()\-]{7,20}$/.test(val('phone'))){mark('phone');return fail(t('e_phone'));}
      if(!val('dob')){mark('dob');return fail(t('e_dob'));}
      if(!/^[A-Za-z0-9_]{5,32}$/.test(val('telegram').replace(/^@/,''))){mark('telegram');return fail(t('e_telegram'));}
      var ph=f.querySelector('[name=photo]');
      if(!ph||!ph.files||!ph.files[0])return fail(t('e_photo_req'));
      if(!/^image\//.test(ph.files[0].type))return fail(t('e_photo'));
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())){email.classList.add('err');return fail(t('e_email'));}
      if(pw.value.length<8){pw.classList.add('err');return fail(t('e_pw_short'));}
    } else {
      if(!email.value.trim()){email.classList.add('err');return fail(t('e_login_empty'));}
      if(!pw.value){pw.classList.add('err');return fail(t('e_login_empty'));}
    }
    var btn=f.querySelector('[data-action=dologin]'); setLoading(btn,true);
    var rawPw=pw.value;
    var photoPromise=isSignup?resizePhoto(f.querySelector('[name=photo]').files[0]):Promise.resolve('');
    photoPromise.then(function(photoData){
      if(isSignup&&!photoData)throw {msg:t('e_photo')};
      return hashPassword(rawPw).then(function(hashed){
        return api(isSignup
          ? {action:'signup',username:val('un'),first:val('first'),last:val('last'),email:email.value.trim(),password:hashed,
             phone:val('phone'),dob:val('dob'),telegram:val('telegram').replace(/^@/,''),photo:photoData}
          : {action:'login',identifier:email.value.trim(),password:hashed});
      });
    }).then(function(res){
      setLoading(btn,false);
      if(!res||!res.ok||!res.token)return fail(errOf(res));
      dbClearOwn();
      state.token=res.token;
      loadUser(res.user);
      state.screen='app';state.tab='dashboard';state.sideOpen=false;persistSession();render();
      sync(true);
      toast(t('t_welcome',{name:state.user.first}));
    }).catch(function(e){
      setLoading(btn,false);
      fail(e&&e.msg?e.msg:t('e_network'));
    });
  }

  function persistSession(){

      applied:projects.filter(function(p){return p.applied;}).map(function(p){return p.id;}),
      pending:projects.filter(function(p){return p.pending;}).map(function(p){return p.id;})})); }catch(e){}
  }
  function clearSession(){ try{localStorage.removeItem(SESSION_KEY);}catch(e){} }
  function applyProjectStates(ap,pend){
    projects.forEach(function(p){ p.applied=ap.indexOf(String(p.id))>=0; p.pending=!p.applied&&pend.indexOf(String(p.id))>=0; });
  }
  function restoreSession(){
    try{
      var raw=localStorage.getItem(SESSION_KEY); if(!raw)return false;
      var s=JSON.parse(raw); if(!s||!s.user||!s.user.un)return false;
      if(CONFIG.API_URL&&!/^[0-9a-f]{64}$/.test(s.token||'')){clearSession();return false;}
      state.token=s.token||'';
      state.user=Object.assign({phone:'',dob:'',telegram:'',photo:'',role:'',permissions:[]},s.user);
      applyProjectStates((s.applied||[]).map(String),(s.pending||[]).map(String));
      if(db.mine)mine=clean({ledger:db.mine.ledger||[],certificates:db.mine.certificates||[],registrations:db.mine.registrations||[],documents:db.mine.documents||[]});
      state.screen='app'; state.tab=(s.tab&&s.tab!=='patches')?s.tab:'dashboard';
      return true;
    }catch(e){return false;}
  }

  function docRow(type){

      '<div class="doc-list">'+evDocs(e).map(docRow).join('')+'</div>'+

      '<button class="btn btn-ghost" data-action="closemodal">'+t('cancel')+'</button></div></div></div>';

  function readDataUrl(file){
    return new Promise(function(resolve){ var r=new FileReader(); r.onload=function(e){resolve(e.target.result);}; r.onerror=function(){resolve('');}; r.readAsDataURL(file); });
  }
  // photos are scaled down so they upload fast but stay readable; PDFs are sent as they are
  function prepareDoc(file){
    if(!file)return Promise.resolve('');
    if(file.type==='application/pdf')return file.size<=DOC_MAX_BYTES?readDataUrl(file):Promise.resolve('');
    if(!/^image\/(jpeg|png|webp)$/.test(file.type))return Promise.resolve('');
    return loadImage(file).then(function(img){
      if(!img)return '';
      var max=1600, r=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      var ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      var q=0.85, data=c.toDataURL('image/jpeg',q);
      while(data.length>DOC_MAX_BYTES*1.3&&q>0.4){ q-=0.1; data=c.toDataURL('image/jpeg',q); }
      return data.length>DOC_MAX_BYTES*1.37?'':data;
    });
  }
  function uploadDoc(input){
    var type=input.getAttribute('data-type'), file=input.files&&input.files[0], row=input.closest('.doc-row');
    if(DOC_TYPES.indexOf(type)<0||!file)return;
    if(!CONFIG.API_URL){ input.value=''; return toast(t('e_need_db')); }
    if(row)row.classList.add('is-busy');
    toast(t('uploading'));
    prepareDoc(file).then(function(data){
      if(!data)throw {msg:t('e_doc_file')};
      return api({action:'uploadDocument',token:state.token,docType:type,data:data});
    }).then(function(res){
      if(res&&!res.ok&&res.code==='auth')return sessionExpired();
      if(!res||!res.ok)throw {msg:errOf(res)};
      var d=clean(res.document||{}); d.type=type; if(!d.status)d.status='pending';
      mine.documents=(mine.documents||[]).filter(function(x){return x.type!==type;}).concat([d]);
      toast(ic('ok',14)+' '+t('t_doc_uploaded'));
      afterDocChange();
    }).catch(function(e){
      if(row)row.classList.remove('is-busy'); input.value='';
      toast(e&&e.msg?e.msg:t('e_network'));
    });
  }

    images.editPhoto='';
    persistSession(); closeModal(); refreshView();
    toast(ic('ok',14)+' '+t('t_profile_saved'));
  }

  /* ---------- ADMIN ACTIONS (instant on screen, saved in the background) ---------- */
  var images={}; // resized uploads waiting for a form submit
  function needApi(){ if(!CONFIG.API_URL){toast(t('e_need_db'));return false;} return true; }
  function v(id){ return ((document.getElementById(id)||{}).value||'').trim(); }
  function n(id){ return Number(v(id))||0; }
  function handleReviewApp(appId,status){
    if(!needApi())return;
    (state.adminApps||[]).forEach(function(a){ if(String(a.id)===String(appId))a.status=status; });
    enqueue({action:'reviewApplication',applicationId:appId,status:status});
    toast(status==='approved'?ic('ok',14)+' '+t('t_approved'):t('t_rejected'));
    redrawMain();
  }
  function handleAddProject(){
    if(!needApi())return;
    var title=v('pTitle'), cat=v('pCat')||'Environment', desc=v('pDesc'), loc=v('pLoc'), date=v('pDate'), time=v('pTime');
    var slots=n('pSlots')||10, stitches=n('pStitches'), hours=n('pHours')||4, photo=images.pPhoto||'';
    var loyEl=document.getElementById('pLoyalty'), loyalty=loyEl&&loyEl.value!==''?Number(loyEl.value):20;
    if(!(loyalty>=0&&loyalty<=5000))return toast(t('e_loyalty'));
    if(title.length<2||title.length>80)return toast(t('e_title'));
    if(slots<1||slots>1000||stitches<0||stitches>2000||hours<1||hours>24)return toast(t('e_numbers'));
    var tmpId='new-'+Date.now();
    var local=clean({id:tmpId,title:title,category:cat,description:desc,location:loc,date:date,time:time,slots:slots,stitches:stitches,hours:hours,loyalty:loyalty,photo:photo});
    projects.push({id:tmpId,t:local.title,cat:local.category,d:local.description,loc:local.location,date:local.date,time:local.time,slots:slots,stitches:stitches,hours:hours,loyalty:loyalty,photo:local.photo,applied:false,pending:false});
    state.adminDBProjects=(state.adminDBProjects||[]).concat([local]);
    enqueue({action:'addProject',title:title,description:desc,category:cat,location:loc,date:date,time:time,slots:slots,stitches:stitches,hours:hours,loyalty:loyalty,photo:photo});
    images.pPhoto='';
    toast(ic('ok',14)+' '+t('t_added',{name:h(title)}));
    redrawMain();
  }
  function handleAdminCheckin(pid,un){
    if(!needApi())return;
    var raw=rawText(un);
    if(!confirm(t('a_confirm_present',{un:raw})))return;
    (state.adminDBProjects||[]).forEach(function(p){ if(p.id===pid)(p.participants||[]).forEach(function(x){ if(x.username===un){ x.attended=true; x.at=new Date().toISOString(); x.by=h(state.user.un); } }); });
    enqueue({action:'adminCheckin',projectId:pid,username:raw});
    toast(ic('ok',14)+' '+t('t_marked_present',{un:h(raw)}));
    redrawMain();
  }
  function handleSaveRewards(id,btn){
    if(!needApi())return;
    var box=btn.closest('.rewards'); if(!box)return;
    var g=function(c){var e=box.querySelector('.'+c);return e&&e.value!==''?Number(e.value):NaN;};
    var r={loyalty:g('rw-loy'),stitches:g('rw-st'),hours:g('rw-h'),slots:g('rw-sl')};
    if(!(r.loyalty>=0&&r.loyalty<=5000))return toast(t('e_loyalty'));
    if(!(r.stitches>=0&&r.stitches<=2000&&r.hours>=1&&r.hours<=24&&r.slots>=1&&r.slots<=1000))return toast(t('e_numbers'));
    [state.adminDBProjects||[],projects].forEach(function(list){ list.forEach(function(p){ if(p.id===id){ for(var k in r)p[k]=r[k]; } }); });
    enqueue({action:'updateProjectRewards',projectId:id,loyalty:r.loyalty,stitches:r.stitches,hours:r.hours,slots:r.slots});
    toast(ic('ok',14)+' '+t('t_saved'));
    redrawMain();
  }
  function handleProjectPhoto(id,data){
    (state.adminDBProjects||[]).forEach(function(p){if(p.id===id)p.photo=data;});
    projects.forEach(function(p){if(p.id===id)p.photo=data;});
    enqueue({action:'setProjectPhoto',projectId:id,photo:data});
    toast(ic('ok',14)+' '+t('t_photo_saved'));
    redrawMain();
  }
  function handleDelete(kind,id){
    if(!needApi())return;
    if(String(id).indexOf('new-')===0)return toast(t('t_still_saving'));
    if(!confirm(t('confirm_delete')))return;
    if(kind==='project'){
      state.adminDBProjects=(state.adminDBProjects||[]).filter(function(p){return p.id!==id;});
      projects=projects.filter(function(p){return p.id!==id;});
      enqueue({action:'deleteProject',projectId:id});
    } else if(kind==='event'){
      site.events=site.events.filter(function(e){return e.id!==id;});
      enqueue({action:'deleteEvent',eventId:id});
    } else {
      site.partners=site.partners.filter(function(p){return p.id!==id;});
      enqueue({action:'deletePartner',partnerId:id});
    }
    toast(ic('ok',14)+' '+t('t_deleted'));
    redrawMain();
  }
  function handleAddEvent(){
    if(!needApi())return;
    var e={title:v('eTitle'),kind:v('eKind')||'free',description:v('eDesc'),date:v('eDate'),time:v('eTime'),location:v('eLoc'),
      price:n('ePrice'),loyaltyCost:n('eCost'),seats:n('eSeats'),minStitches:n('eMinS'),minHours:n('eMinH'),minProjects:n('eMinP'),minLoyalty:n('eMinL'),photo:images.ePhoto||'',
      docs:[].map.call(document.querySelectorAll('.eDoc:checked'),function(c){return c.value;}).filter(function(d){return DOC_TYPES.indexOf(d)>=0;})};
    if(e.title.length<2||e.title.length>80)return toast(t('e_title'));
    if(!e.date)return toast(t('e_date'));
    if(e.kind==='paid'&&e.price<1)return toast(t('e_price'));
    if(e.kind==='loyalty'&&e.loyaltyCost<1)return toast(t('e_cost'));
    var local=clean(e); local.id='new-'+Date.now(); local.taken=0;
    if(e.kind!=='paid')local.price=0; if(e.kind!=='loyalty')local.loyaltyCost=0;
    site.events.push(local);
    var op={action:'addEvent'}; for(var k in e)op[k]=e[k];
    enqueue(op);
    images.ePhoto='';
    toast(ic('ok',14)+' '+t('t_added',{name:h(e.title)}));
    redrawMain();
  }
  function handleRegStatus(id,status){
    if(!needApi())return;
    if(status==='cancelled'&&!confirm(t('ev_confirm_cancel')))return;
    if(status==='rejected'&&!confirm(t('reject')+'?'))return;
    var shown=status;
    (state.adminRegs||[]).forEach(function(r){
      if(r.id!==id)return;
      if(status==='approved'){ var ev=site.events.filter(function(x){return x.id===r.eventId;})[0]||{}; shown=(ev.kind==='paid'||r.kind==='paid')?'awaiting_payment':'registered'; }
      r.status=shown;
    });
    enqueue({action:'setEventRegStatus',regId:id,status:status});
    toast(ic('ok',14)+' '+t('rs_'+shown));
    redrawMain();
  }
  function handleAddPartner(){
    if(!needApi())return;
    var name=v('ptName'), url=v('ptUrl'), desc=v('ptDesc');
    if(name.length<2||name.length>80)return toast(t('e_title'));
    if(url&&!/^https:\/\/[^\s"'<>]{3,300}$/.test(url))return toast(t('e_url'));
    site.partners.push(clean({id:'new-'+Date.now(),name:name,url:url,description:desc,logo:images.ptLogo||''}));
    enqueue({action:'addPartner',name:name,url:url,description:desc,logo:images.ptLogo||''});
    images.ptLogo='';
    toast(ic('ok',14)+' '+t('t_added',{name:h(name)}));
    redrawMain();
  }
  function handleSaveAbout(){
    if(!needApi())return;
    LANGS.forEach(function(L){
      var val=((document.getElementById('about_'+L[0])||{}).value||'').trim();
      site.about[L[0]]=h(val);
      enqueue({action:'saveContent',key:'about_'+L[0],value:val});
    });
    toast(ic('ok',14)+' '+t('t_saved'));
  }
  function handleSavePayments(){
    if(!needApi())return;
    var pv={paymeId:v('payMid'),paymeField:v('payField')||'order_id',clickServiceId:v('clkSid'),clickMerchantId:v('clkMid')};
    if(pv.paymeId&&!/^[0-9a-f]{24}$/i.test(pv.paymeId))return toast(t('e_payme_id'));
    if(!/^[A-Za-z0-9_]{1,40}$/.test(pv.paymeField))return toast(t('e_payme_id'));
    if((pv.clickServiceId||pv.clickMerchantId)&&!(/^\d{1,12}$/.test(pv.clickServiceId)&&/^\d{1,12}$/.test(pv.clickMerchantId)))return toast(t('e_click_id'));
    site.payments=cleanPayments(pv);
    enqueue({action:'saveContent',key:'payments',value:pv});
    toast(ic('ok',14)+' '+t('t_saved'));
  }
  function handleSaveContacts(){
    if(!needApi())return;
    var c={phone:v('cPhone'),email:v('cEmail'),telegram:v('cTg'),instagram:v('cIg'),address:v('cAddr'),hours:v('cHours'),map:v('cMap')};
    if(c.map&&!/^https:\/\/[^\s"'<>]{3,300}$/.test(c.map))return toast(t('e_url'));
    site.contacts=clean(c);
    enqueue({action:'saveContent',key:'contacts',value:c});
    toast(ic('ok',14)+' '+t('t_saved'));
  }
  function handleSetAdmin(makeAdmin,targetUn){
    if(!needApi())return;
    var un=targetUn||v('adminTargetUn'); if(!un)return toast(t('e_username'));
    var perms=[];
    if(makeAdmin){ document.querySelectorAll('.adminPerm:checked').forEach(function(cb){perms.push(cb.value);}); if(!perms.length)return toast(t('e_perm_pick')); }
    var lower=un.toLowerCase();
    if(!makeAdmin&&lower===String(state.user.un).toLowerCase())return toast(t('e_self_admin'));
    (state.adminUsers||[]).forEach(function(u){ if(String(u.username).toLowerCase()===lower){u.role=makeAdmin?'admin':'';u.permissions=perms;} });
    if(state.adminList){
      var found=state.adminList.filter(function(a){return String(a.username).toLowerCase()===lower;})[0];
      if(!makeAdmin)state.adminList=state.adminList.filter(function(a){return a!==found;});
      else if(found)found.permissions=perms;
      else{
        var u=(state.adminUsers||[]).filter(function(x){return String(x.username).toLowerCase()===lower;})[0]||{};
        state.adminList.push({username:h(un),first:u.first||'',last:u.last||'',photo:u.photo||'',permissions:perms});
      }
    }
    // the logged-in admin edited their own rights: apply right away
    if(lower===String(state.user.un).toLowerCase()){ state.user.permissions=perms; persistSession(); }
    enqueue({action:'setAdminRole',targetUsername:un,role:makeAdmin?'admin':'',permissions:perms});
    toast(makeAdmin?ic('shield',14)+' '+t('t_now_admin',{un:h(un)}):t('t_admin_removed',{un:h(un)}));
    redrawMain();
  }

  /* ---------- EVENTS ---------- */
  var ACTIONS={
    lang:function(el){setLang(el.getAttribute('data-l'));},
    goauth:function(el){state.screen='auth';state.authMode=el.getAttribute('data-mode')||'login';render();warmUp();},
    home:function(){ if(state.screen==='app'){state.tab='dashboard';render();} else {state.screen='landing';render();} },
    toapp:function(){state.screen='app';render();sync();},
    page:function(el,e){ e.preventDefault(); state.page=el.getAttribute('data-p'); state.screen=state.token&&state.screen==='app'?'app':'info';
      if(state.screen==='app'){state.tab=state.page;} render(); sync(); },
    authmode:function(el){state.authMode=el.getAttribute('data-mode');render();},
    dologin:function(el,e){e.preventDefault();doAuth();},
    nav:function(el){state.tab=el.getAttribute('data-tab');state.sideOpen=false;render();sync(state.tab==='admin');},
    toggleside:function(){state.sideOpen=!state.sideOpen;var s=document.querySelector('.side'),b=document.querySelector('.side-bg');if(s)s.classList.toggle('open',state.sideOpen);if(b)b.classList.toggle('open',state.sideOpen);},
    logout:function(){ if(CONFIG.API_URL&&state.token)enqueue({action:'logout'}); flush(true); dbClearOwn(); clearSession(); state.token=''; state.sideOpen=false; state.screen='landing'; state.tab='dashboard'; render(); },
    projcat:function(el){state.projCat=el.getAttribute('data-cat');var g=document.getElementById('projGrid');if(g)g.innerHTML=renderGrid();document.querySelectorAll('.catchip').forEach(function(c){c.classList.toggle('on',c.getAttribute('data-cat')===state.projCat);});},
    evfilter:function(el){state.evFilter=el.getAttribute('data-f');render(true);},
    progmetric:function(el){state.progMetric=state.progMetric===el.getAttribute('data-m')?'all':el.getAttribute('data-m');redrawMain();},
    apply:function(el){ if(el.closest('.detail-modal'))closeModal(); applyProject(el.getAttribute('data-id')); },
    details:function(el){openDetail(el.getAttribute('data-kind'),el.getAttribute('data-id'));},
    share:function(el){shareItem(el.getAttribute('data-kind'),el.getAttribute('data-id'));},
    changepw:function(){openPwModal();},
    savepw:function(el,e){e.preventDefault();handleChangePw(el);},
    viewdoc:function(el){viewDoc(el.getAttribute('data-un'),el.getAttribute('data-type'),el);},
    checkin:function(){openCheckin();},
    docheckin:function(el){doCheckin(el);},
    evregister:function(el){ if(el.closest('.detail-modal'))closeModal(); registerEvent(el,el.getAttribute('data-id')); },
    evcancel:function(el){ if(el.closest('.detail-modal'))closeModal(); cancelReg(el,el.getAttribute('data-id')); },
    opencert:function(el){openCert(el.getAttribute('data-id'));},
    pdfcert:function(el){downloadCert(el.getAttribute('data-id'),el);},
    printcert:function(){document.body.classList.add('printing');window.print();setTimeout(function(){document.body.classList.remove('printing');},500);},
    closemodal:function(el,e){ if(!el.classList.contains('modal-bg')||!e.target.closest('.modal,.cert-wrap'))closeModal(); },
    editprofile:function(){images.editPhoto='';openEditProfileModal();},
    saveprofile:function(el,e){e.preventDefault();handleSaveProfile();},
    admintab:function(el){state.adminTab=el.getAttribute('data-t');redrawMain();},
    viewuser:function(el){openUserModal(el.getAttribute('data-un'));},
    reviewApp:function(el){handleReviewApp(el.getAttribute('data-id'),el.getAttribute('data-s'));},
    adminAddProject:function(){handleAddProject();},
    deleteProject:function(el){handleDelete('project',el.getAttribute('data-id'));},
    saveRewards:function(el){handleSaveRewards(el.getAttribute('data-id'),el);},
    adminCheckin:function(el){handleAdminCheckin(el.getAttribute('data-pid'),el.getAttribute('data-un'));},
    adminAddEvent:function(){handleAddEvent();},
    deleteEvent:function(el){handleDelete('event',el.getAttribute('data-id'));},
    regstatus:function(el){handleRegStatus(el.getAttribute('data-id'),el.getAttribute('data-s'));},
    adminAddPartner:function(){handleAddPartner();},
    deletePartner:function(el){handleDelete('partner',el.getAttribute('data-id'));},
    saveAbout:function(){handleSaveAbout();},
    saveContacts:function(){handleSaveContacts();},
    savePayments:function(){handleSavePayments();},
    paynow:function(el){openPayModal(el.getAttribute('data-id'));},
    doverify:function(el){doVerify(el);},
    setAdmin:function(){handleSetAdmin(true);},
    removeAdmin:function(){handleSetAdmin(false);},
    editAdmin:function(el){editAdmin(el.getAttribute('data-un'));},
    removeAdminRow:function(el){ var un=String(el.getAttribute('data-un')); if(confirm(t('a_confirm_remove',{un:un})))handleSetAdmin(false,un); }
  };
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-action]'); if(!el)return;
    var fn=ACTIONS[el.getAttribute('data-action')]; if(fn)fn(el,e);
  });
  document.addEventListener('input',function(e){
    if(e.target.id==='projSearch'){state.projSearch=e.target.value;var g=document.getElementById('projGrid');if(g)g.innerHTML=renderGrid();}
    if(e.target.id==='userSearch'){state.userSearch=e.target.value;var ul=document.getElementById('userList');if(ul)ul.innerHTML=userRows();}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&overlay.innerHTML)closeModal();
    if(e.key!=='Enter')return;
    if(state.screen==='auth'&&document.getElementById('authForm')&&e.target.tagName==='INPUT'){e.preventDefault();doAuth();}
    else if(e.target&&e.target.id==='verifyId'){e.preventDefault();doVerify(document.querySelector('[data-action=doverify]'));}
    else if(e.target&&e.target.id==='ciCode'){e.preventDefault();doCheckin(document.querySelector('[data-action=docheckin]'));}
  });
  // image pickers: [input id, width, height, fit, preview id]
  var PICKERS={photoInput:[160,160,'cover','photoPreview'],editPhotoInput:[160,160,'cover','editPhotoPreview'],
    pPhoto:[480,270,'cover','pPhotoPrev'],ePhoto:[480,270,'cover','ePhotoPrev'],ptLogo:[300,150,'contain','ptLogoPrev']};
  var PICK_KEY={editPhotoInput:'editPhoto',pPhoto:'pPhoto',ePhoto:'ePhoto',ptLogo:'ptLogo'};
  document.addEventListener('change',function(e){
    var el=e.target; if(!el)return;
    if(el.id==='eKind'){
      document.getElementById('ePriceF').style.display=el.value==='paid'?'':'none';
      document.getElementById('eCostF').style.display=el.value==='loyalty'?'':'none';
      return;
    }
    var file=el.files&&el.files[0];
    if(el.classList&&el.classList.contains('docInput')){ if(file)uploadDoc(el); return; }
    if(el.classList&&el.classList.contains('projPhotoInput')&&file){
      resizeImage(file,480,270,'cover').then(function(d){ if(d)handleProjectPhoto(el.getAttribute('data-id'),d); else toast(t('e_photo')); });
      return;
    }
    var cfg=PICKERS[el.id]; if(!cfg||!file)return;
    resizeImage(file,cfg[0],cfg[1],cfg[2]).then(function(d){
      if(!d){toast(t('e_photo'));el.value='';return;}
      if(PICK_KEY[el.id])images[PICK_KEY[el.id]]=d;
      var prev=document.getElementById(cfg[3]); if(prev)prev.innerHTML='<img src="'+d+'" alt="">';
    });
  });

  // instant start from the local DB, then the Google Sheet (source of truth) overwrites it
  document.title=t('doc_title');
  applyDB(false);
  restoreSession();
  render();
  deepLink=readDeepLink(); if(deepLink)tryDeepLink();
  sync(true);
  setInterval(function(){ if(document.visibilityState==='visible')sync(); },SYNC_EVERY);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible')sync(); else flush(true); });
  window.addEventListener('online',function(){ sync(true); });
})();

</script>
</body>
</html>
